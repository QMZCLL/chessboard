name: 打包

# 触发方式：推送 v 开头的标签；手动触发（工作流在默认分支上时，Actions 页面 → 打包 → Run workflow）；
# 打包定义本身改动时在所在分支运行一次，确认仍能打出安装包（标签推送不受路径限制）。
# 产物在这次运行页面底部的 Artifacts 中下载。安装包没有代码签名。
# 打出安装包后还会检查：全新安装到带空格与中文的目录、冒烟测试（xqlink --smoke）、卸载后学习数据保留、
# 从仓库中 v0.3.0 的发布原地升级并迁移学习数据（scripts/package-check.ps1、scripts/package-check.sh）。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: [".github/workflows/package.yml"]

jobs:
  windows:
    name: Windows 安装包（MSI）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 不含屏幕识别所需的 ONNX Runtime 与模型（不在仓库中），其他功能都可用
      - name: 打包
        run: pnpm build:cpu
      - uses: actions/upload-artifact@v4
        with:
          name: xqlink-windows-msi
          path: server/target/release/bundle/msi/*.msi
          if-no-files-found: error
      # 升级检查从仓库中的 v0.3.0 发布开始；仓库中没有这个发布时跳过（发布存在而下载失败时整个流程失败）
      - name: 下载 v0.3.0 的安装包（升级检查用）
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 只有确实没有这个发布时才跳过；其他错误（权限、网络）让流程失败并显示原因
          $out = gh release view v0.3.0 -R "${{ github.repository }}" --json tagName 2>&1
          if ($LASTEXITCODE -ne 0) {
            if ("$out" -match "not found") { Write-Host "::notice::仓库中没有 v0.3.0 的发布，跳过升级检查"; exit 0 }
            throw "查询 v0.3.0 的发布失败：$out"
          }
          $dir = Join-Path $env:RUNNER_TEMP "previous"
          gh release download v0.3.0 -R "${{ github.repository }}" -p "*.msi" -D $dir
          if ($LASTEXITCODE -ne 0) { throw "下载 v0.3.0 的安装包失败" }
          "msi=$((Get-ChildItem $dir -Filter *.msi | Select-Object -First 1).FullName)" >> $env:GITHUB_OUTPUT
      # 全新安装到带空格与中文的目录、冒烟测试、卸载后数据保留、从 v0.3.0 原地升级并迁移数据（见脚本说明）
      - name: 安装、升级与卸载检查
        shell: pwsh
        run: ./scripts/package-check.ps1 -Msi (Get-ChildItem server/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName -Previous "${{ steps.previous.outputs.msi }}"
      - name: 保存检查的报告与安装日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-check-windows
          path: ${{ runner.temp }}/安装包 检查
          if-no-files-found: ignore

  linux:
    name: Linux 安装包（deb）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # WebView 与托盘、屏幕截图（xcap：X11、Wayland、PipeWire）所需的系统库
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libclang-dev libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libegl-dev libgbm-dev \
            libxcb1-dev libxcb-randr0-dev libxrandr-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 打包
        run: pnpm tauri build --config server/tauri.linux.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: xqlink-linux-deb
          path: server/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: 下载 v0.3.0 的 deb（升级检查用）
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 只有确实没有这个发布时才跳过；其他错误（权限、网络）让流程失败并显示原因
          if ! out=$(gh release view v0.3.0 -R "${{ github.repository }}" --json tagName 2>&1); then
            if echo "$out" | grep -qi "not found"; then
              echo "::notice::仓库中没有 v0.3.0 的发布，跳过升级检查"
              exit 0
            fi
            echo "查询 v0.3.0 的发布失败：$out"
            exit 1
          fi
          gh release download v0.3.0 -R "${{ github.repository }}" -p "*.deb" -D "$RUNNER_TEMP/previous"
          echo "deb=$(ls "$RUNNER_TEMP"/previous/*.deb | head -1)" >> "$GITHUB_OUTPUT"
      - name: 安装、升级与卸载检查
        run: scripts/package-check.sh "$(ls server/target/release/bundle/deb/*.deb | head -1)" "${{ steps.previous.outputs.deb }}"
      - name: 保存检查的报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-check-linux
          path: ${{ runner.temp }}/安装包 检查
          if-no-files-found: ignore
