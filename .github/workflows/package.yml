name: 打包

# 触发方式：推送 v 开头的标签；手动触发（工作流在默认分支上时，Actions 页面 → 打包 → Run workflow）；
# 打包定义本身改动时在所在分支运行一次，确认仍能打出安装包（标签推送不受路径限制）。
# 产物在这次运行页面底部的 Artifacts 中下载。安装包没有代码签名。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: [".github/workflows/package.yml"]

jobs:
  windows:
    name: Windows 安装包（MSI）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 不含屏幕识别所需的 ONNX Runtime 与模型（不在仓库中），其他功能都可用
      - name: 打包
        run: pnpm build:cpu
      - uses: actions/upload-artifact@v4
        with:
          name: xqlink-windows-msi
          path: server/target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux:
    name: Linux 安装包（deb）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # WebView 与托盘、屏幕截图（xcap：X11、Wayland、PipeWire）所需的系统库
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libclang-dev libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libegl-dev libgbm-dev \
            libxcb1-dev libxcb-randr0-dev libxrandr-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 打包
        run: pnpm tauri build --config server/tauri.linux.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: xqlink-linux-deb
          path: server/target/release/bundle/deb/*.deb
          if-no-files-found: error
