name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: 规则、讲解与引擎服务测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml -p xq-core -p xq-app -p xq-devserver --all-targets -- -D warnings
      # 包含使用仓库自带 Pikafish 的流程测试；缺少引擎时测试失败而不是跳过
      - name: 测试
        run: cargo test --manifest-path server/Cargo.toml -p xq-core -p xq-app
      # 系统代理不可达时，访问本机模型服务（如 Ollama、测试用的模拟服务）仍不能经过代理
      - name: 本机模型服务不经过系统代理
        run: cargo test --manifest-path server/Cargo.toml -p xq-app --test coach_flow
        env:
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          all_proxy: socks5://127.0.0.1:9

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm test:unit
      - run: pnpm exec vite build

  e2e:
    name: 浏览器端到端场景
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 中文字体只影响截图与排版宽度，不影响按文字定位
      - name: 安装 Chromium 与中文字体
        run: |
          pnpm exec playwright-core install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 运行场景
        run: pnpm test:e2e
      - name: 保存截图与日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: tests/e2e/.out
          # .out 以点开头，默认会被当作隐藏目录跳过
          include-hidden-files: true
          retention-days: 7

  desktop-windows:
    name: 桌面程序编译检查（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml -p xqlink -- -D warnings
