[package]
name = "xqlink"
version = "0.2.0"
description = "中国象棋学习助手"
authors = ["atopx <3940422@qq.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xqlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
xq-core = { path = "crates/xq-core" }
xq-app = { path = "crates/xq-app" }
tauri = { version = "2.5.1", features = [] }
tauri-plugin-opener = "2.2.6"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = { version = "0.5.1" }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
tracing-appender = "0.2"
ndarray = "0.16"

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "load-dynamic"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.9", features = ["coreml"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.9", features = ["cuda", "load-dynamic"] }

[profile.dev]
incremental = true

[features]
default = []
# 默认使用旋转版识别模型（运行时加载 libs/models/rotate.onnx）
rotate = []
gpu = [
    "ort/copy-dylibs",
    "ort/cuda",
    "ort/directml"
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]
members = ["crates/xq-core", "crates/xq-app", "crates/xq-devserver"]
resolver = "2"
