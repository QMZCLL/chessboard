[package]
name = "xq-devserver"
version = "0.3.0"
edition = "2024"
publish = false
description = "开发桥：在浏览器中调试界面时，用 HTTP 与服务器推送事件代替 Tauri IPC（不随应用发布）"

[features]
# 端到端场景使用：开发桥接受 dev_failpoint 命令，在写入的关键位置模拟崩溃（见 xq-app 的 failpoints）
failpoints = ["xq-app/failpoints"]

[dependencies]
base64 = "0.22"
xq-app = { path = "../xq-app" }
xq-core = { path = "../xq-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
